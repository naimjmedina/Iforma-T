<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario para plantear dudas sobre los ciclos de Informática del CIFP César Manrique.">
    <title>Formulario de dudas | CIFP César Manrique</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <a class="salto-contenido" href="#contenido">Saltar al contenido</a>
    <header class="cabecera">
        <nav class="menu" aria-label="Menú principal">
            <a href="index.html">Inicio</a>
            <a href="ciclos.html">Ciclos</a>
            <a href="comparativa.html">Comparativa</a>
            <a href="contacto.html" aria-current="page">Formulario de dudas</a>
        </nav>
    </header>
    <main id="contenido" class="contenido" tabindex="-1">
        <h1>Resuelve tus dudas</h1>
        <form class="formulario" action="#" method="post">
            <fieldset>
                <legend>Datos personales</legend>
                <div class="campos">
                    <div><label for="nombre">Nombre</label><input id="nombre" name="nombre" type="text" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]{2,40}"></div>
                    <div><label for="email">Correo electrónico</label><input id="email" name="email" type="email" required placeholder="nombre@ejemplo.com"></div>
                    <div><label for="telefono">Teléfono</label><input id="telefono" name="telefono" type="tel" pattern="[0-9]{9}" placeholder="600123123"></div>
                    <div><label for="centro">Centro o instituto</label><input id="centro" name="centro" type="text" list="lista-centros"><datalist id="lista-centros"><option value="CIFP César Manrique"></option><option value="IES Canarias"></option><option value="IES El Rincón"></option></datalist></div>
                </div>
            </fieldset>
            <fieldset>
                <legend>Tu consulta</legend>
                <div class="campos">
                    <div><label for="ciclo">Ciclo que te interesa</label><select id="ciclo" name="ciclo" required><option value="">Selecciona una opción</option><option>SMR</option><option>ASIR</option><option>DAM</option><option>DAW</option></select></div>
                    <div><label for="calculo">Pregunta de cálculo: 6 + 7</label><input id="calculo" name="calculo" type="number" required min="13" max="13"></div>
                    <div class="campo-ancho"><label for="mensaje">Escribe tu duda</label><textarea id="mensaje" name="mensaje" rows="5" required></textarea></div>
                </div>
            </fieldset>
            <button type="submit">Enviar consulta</button>
        </form>
    </main>
    <footer class="pie"><p>CIFP César Manrique · Jornadas de orientación</p></footer>
</body>
</html>
